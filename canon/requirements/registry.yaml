policy_pack_v1:
  qualification:
    default: DENY_OR_MANUAL_REVIEW
    commercial_inputs_forbidden: true
    unknown_is_eligible: false
  ranking:
    mode: LEXICOGRAPHIC_V1
    order:
    - RELEVANCE_MATCH
    - EXPERTISE
    - RELIABILITY
    - REPUTATION
    - AVAILABILITY_RESPONSE
    - PLATFORM_EXPERIENCE_CONTRIBUTION_OFFERING
    - COMMERCIAL_BOOST_WITHIN_ALLOWED_BAND
    sponsored_label_required: true
  commission:
    missing_rule: BLOCK_POLICY_NOT_CONFIGURED
    silent_default_rate: false
  jurisdiction:
    missing_or_unknown: BLOCK_OR_REVIEW
    explicit_enablement_required: true
  notifications:
    booking_reminder_baseline:
    - PT24H
    - PT2H
    - PT15M
    - AT_START
    respect_channel_and_user_rules: true
  avatar_privacy:
    default_mode: PRIVATE_EPHEMERAL
    raw_to_growth_or_intelligence_without_targeted_consent: false
  market_cell:
    missing_thresholds: NOT_SCALE_READY
