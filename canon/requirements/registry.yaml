    unknown_is_eligible: false
  ranking:
    mode: LEXICOGRAPHIC_V1
    order:
    - RELEVANCE_MATCH
    - EXPERTISE
    - RELIABILITY
    - REPUTATION
    - AVAILABILITY_RESPONSE
    - PLATFORM_EXPERIENCE_CONTRIBUTION_OFFERING
