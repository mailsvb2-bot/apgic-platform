version: 1
exceptions:
  - exception_id: APGIC-MOBILE-004-WEB-NOT-APPLICABLE
    requirement_id: APGIC-MOBILE-004
    status: APPROVED
    surfaces:
      - WEB
    reason: >-
      APGIC-MOBILE-004 implements Canon section 318 Native OS Capability Layer.
      Its acceptance and required evidence are explicitly native-only; browser/web
      permission behavior is outside this requirement and must not be represented
      by fabricated WEB evidence.
    approved_by: mailsvb2-bot

  - exception_id: APGIC-MOBILE-005-WEB-NOT-APPLICABLE
    requirement_id: APGIC-MOBILE-005
    status: APPROVED
    surfaces:
      - WEB
    reason: >-
      APGIC-MOBILE-005 implements the native Device Identity / ClientInstallation /
      PushEndpoint lifecycle from Canon section 319. Web participates in the same
      user Identity but has no iOS/Android ClientInstallation or push-token rotation
      lifecycle under this requirement; fabricating WEB installation evidence would
      create a false parallel device truth.
    approved_by: mailsvb2-bot

  - exception_id: APGIC-MOBILE-013-WEB-NOT-APPLICABLE
    requirement_id: APGIC-MOBILE-013
    status: APPROVED
    surfaces:
      - WEB
    reason: >-
      APGIC-MOBILE-013 implements the installed native app version/build/contract
      compatibility and safe forced-update policy from Canon section 322. Its
      acceptance and required evidence are explicitly installed-client/native E2E;
      WEB has no native AppVersion/BuildNumber lifecycle under this requirement.
      Fabricating WEB compatibility evidence would misrepresent requirement scope.
    approved_by: mailsvb2-bot


  - exception_id: APGIC-MOBILE-027-WEB-NOT-APPLICABLE
    requirement_id: APGIC-MOBILE-027
    status: APPROVED
    surfaces:
      - WEB
    reason: >-
      APGIC-MOBILE-027 implements the installed native app remote-config,
      compatibility-window and emergency kill-switch behavior from Canon section
      330. Web has no installed AppVersion/BuildNumber lifecycle under this
      requirement; fabricating WEB kill-switch evidence would misrepresent the
      acceptance scope. Web remains governed by the same server-side business
      truth and authorization/financial/qualification policies.
    approved_by: mailsvb2-bot
  - exception_id: APGIC-MOBILE-010-WEB-NOT-APPLICABLE
    requirement_id: APGIC-MOBILE-010
    status: APPROVED
    surfaces:
      - WEB
    reason: >-
      APGIC-MOBILE-010 governs native device persistence, Android Keystore,
      iOS Keychain, native backup behavior and logout/revoke cleanup. Web storage
      is governed by separate browser/session boundaries; fabricating WEB native
      storage evidence would misrepresent this requirement's acceptance scope.
    approved_by: mailsvb2-bot

  - exception_id: APGIC-MOBILE-028-WEB-NOT-APPLICABLE
    requirement_id: APGIC-MOBILE-028
    status: APPROVED
    surfaces:
      - WEB
    reason: >-
      APGIC-MOBILE-028 defines the launch topology for one installed iOS/Android
      application with authorization-safe role/workspace switching under one
      Identity. WEB shares the same backend Identity, authorization and tenant
      truth, but it is not an installed native app and therefore does not have
      the native one-app topology lifecycle covered by this requirement.
      Fabricating WEB evidence for an iOS/Android application-topology requirement
      would misstate the acceptance scope; web authorization remains covered by
      the shared server contracts and tenant-isolation requirements.
    approved_by: mailsvb2-bot

