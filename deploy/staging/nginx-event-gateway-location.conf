# Managed by APGIC deploy/staging/install-event-gateway-nginx.sh
# Only same-host callers; service token and scoped credentials remain mandatory.
location = /_internal/apgic-event-gateway {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:43114/;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
