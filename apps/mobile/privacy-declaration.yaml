version: 1
build_scope: R0_NATIVE_BUILD_GRAPH
tracking: false
collected_data_classes: []
shared_data_classes: []
required_permissions: []
required_reason_apis:
  - NSPrivacyAccessedAPICategoryFileTimestamp
  - NSPrivacyAccessedAPICategorySystemBootTime
  - NSPrivacyAccessedAPICategoryUserDefaults
runtime_dependency_assertions:
  react:
    egress: NONE
    data_classes: []
    permissions: []
  react-native:
    egress: NONE_BY_DEFAULT
    data_classes:
      - INTERNAL
    permissions: []
store_artifacts:
  apple_privacy_manifest:
    status: GENERATED_AND_VERIFIED
    path: apps/mobile/ios/APGIC/PrivacyInfo.xcprivacy
    production_submission: false
    reason: "Verified against the committed CI native build graph; not App Store production evidence."
  google_data_safety:
    status: GENERATED_AND_VERIFIED
    path: apps/mobile/android/data-safety.yaml
    production_submission: false
    reason: "Verified against the committed CI Android manifest; not Google Play production evidence."
