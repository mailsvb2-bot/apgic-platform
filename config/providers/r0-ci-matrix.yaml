version: providers-ci-v1
scope: CI_ONLY
production_approved: false
capabilities:
  NOTIFICATION_PROVIDER:
    enabled: true
    environment: CI
    jurisdictions: [CI_TEST]
    regions: [CI]
    credential_owner: CI_PLATFORM_SECURITY
    credential_ref_contract: secretref://notification/provider-instance
    scopes: [notification:send]
    webhook_event_contract_version: notification-provider-events-v1
    data_classes_transmitted: [INTERNAL]
    retention_subprocessor_terms_ref: ci://notification-retention-v1
    timeout_seconds: 5
    retry_policy: BOUNDED_EXPONENTIAL_V1
    idempotency_contract: IDEMPOTENCY_KEY_REQUIRED
    reconciliation_method: DELIVERY_RECEIPT_RECONCILIATION
    health_policy: ACTIVE_HEALTHCHECK_WITH_DEGRADED_MODE
    kill_switch: DISABLE_NEW_SENDS
    primary_provider: CI_NOTIFICATION_A
    fallback_providers:
      - CI_NOTIFICATION_B
    degraded_behavior: QUEUE_WITH_BOUNDED_TTL
    certification_status: CI_SYNTHETIC_ONLY
    exit_semantics: DISABLE_NEW_SENDS_AND_DRAIN_EXISTING
    provider_neutral_contract: true
  PAYMENT_PROVIDER:
    enabled: true
    environment: CI
    jurisdictions: [CI_TEST]
    regions: [CI]
    credential_owner: CI_PLATFORM_SECURITY
    credential_ref_contract: secretref://payment/provider-instance
    scopes: [payment:evidence:read]
    webhook_event_contract_version: payment-provider-webhook-v1
    data_classes_transmitted: [FINANCIAL_EVIDENCE]
    retention_subprocessor_terms_ref: ci://payment-retention-v1
    timeout_seconds: 10
    retry_policy: BOUNDED_EXPONENTIAL_V1
    idempotency_contract: PROVIDER_EVENT_ID_EXACTLY_ONCE_EFFECT
    reconciliation_method: ORDER_LEDGER_PROVIDER_EVIDENCE
    health_policy: BLOCK_NEW_ATTEMPTS_WHEN_UNAVAILABLE
    kill_switch: DISABLE_NEW_PAYMENT_ATTEMPTS
    primary_provider: CI_PAYMENT_A
    fallback_providers:
      - CI_PAYMENT_B
      - CI_STORE_PROVIDER
    degraded_behavior: BLOCK_NEW_IRREVERSIBLE_ATTEMPTS_AND_RECONCILE_IN_FLIGHT
    certification_status: CI_SYNTHETIC_ONLY
    exit_semantics: STOP_NEW_ATTEMPTS_PRESERVE_PAYMENT_AND_LEDGER_HISTORY
    provider_neutral_contract: true
  COMMUNICATION_PROVIDER:
    enabled: true
    environment: CI
    jurisdictions: [CI_TEST]
    regions: [CI]
    credential_owner: CI_PLATFORM_SECURITY
    credential_ref_contract: secretref://communication/provider-instance
    scopes: [communication:session]
    webhook_event_contract_version: communication-provider-events-v1
    data_classes_transmitted: [SENSITIVE]
    retention_subprocessor_terms_ref: ci://communication-retention-v1
    timeout_seconds: 10
    retry_policy: BOUNDED_RECONNECT_V1
    idempotency_contract: SESSION_COMMAND_ID_REQUIRED
    reconciliation_method: SESSION_LIFECYCLE_RECONCILIATION
    health_policy: P2P_FIRST_WITH_PROVIDER_DEGRADED_MODE
    kill_switch: DISABLE_NEW_JOINS
    primary_provider: CI_COMMUNICATION_A
    fallback_providers:
      - CI_COMMUNICATION_B
    degraded_behavior: RECOVER_THEN_RESCHEDULE_OR_REFUND
    certification_status: CI_SYNTHETIC_ONLY
    exit_semantics: STOP_NEW_JOINS_PRESERVE_LIFECYCLE_AND_RECOVERY_EVIDENCE
    provider_neutral_contract: true
providers:
  CI_NOTIFICATION_A:
    kind: SYNTHETIC
    certified: true
    capabilities:
      - NOTIFICATION_PROVIDER
  CI_NOTIFICATION_B:
    kind: SYNTHETIC
    certified: true
    capabilities:
      - NOTIFICATION_PROVIDER
  CI_PAYMENT_A:
    kind: SYNTHETIC
    certified: true
    capabilities:
      - PAYMENT_PROVIDER
  CI_PAYMENT_B:
    kind: SYNTHETIC
    certified: true
    capabilities:
      - PAYMENT_PROVIDER
  CI_STORE_PROVIDER:
    kind: SYNTHETIC
    certified: true
    capabilities:
      - PAYMENT_PROVIDER
  CI_COMMUNICATION_A:
    kind: SYNTHETIC
    certified: true
    capabilities:
      - COMMUNICATION_PROVIDER
  CI_COMMUNICATION_B:
    kind: SYNTHETIC
    certified: true
    capabilities:
      - COMMUNICATION_PROVIDER
notes:
  - "Synthetic CI-only providers. Brand/vendor names are not canonical domain types."
