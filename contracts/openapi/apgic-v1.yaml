        method_code:
          type: string
        rail_code:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message_safe, correlation_id, retryable]
      properties:
        code: { type: string }
        message_safe: { type: string }
        correlation_id: { type: string }
        retryable: { type: boolean }
        field_errors:
          type: array
          items: { type: object }
        policy_reason_codes:
          type: array
          items: { type: string }
        documentation_ref: { type: string }
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
        reason_code: { type: string }
    Meta:
      type: object
      required: [service, release_track, surfaces, time]
      properties:
        service: { type: string }
        release_track: { type: string }
        surfaces:
          type: array
          items: { $ref: '#/components/schemas/Surface' }
        commit_sha: { type: string }
        time: { type: string, format: date-time }
    ClientInstallation:
      type: object
      additionalProperties: false
      required: [id, identity_id, platform, push_generation, state, updated_at]
      properties:
