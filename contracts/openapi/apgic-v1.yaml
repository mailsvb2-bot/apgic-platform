openapi: 3.1.0
info:
  title: APGIC Public API
  version: 0.5.0-r0-mobile-installation
servers: []
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
  /readyz:
    get:
      operationId: readiness
      responses:
        '200':
          description: Launch configuration and required runtime dependencies are ready
        '503':
          description: Launch configuration or required runtime dependency is not ready and fails closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/meta:
    get:
      operationId: getMeta
      responses:
        '200':
          description: APGIC service metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
  /v1/mobile/installations:
    get:
      operationId: listMobileInstallations
      description: Lists device installations owned by the signed Identity. Installation identity is separate from user Identity.
      security:
        - ClientSession: []
      responses:
        '200':
          description: Installations for the signed Identity, including revoked historical installations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInstallationList'
        '401':
          description: Trusted client session is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Installation storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: registerMobileInstallation
      description: Registers one iOS/Android installation under the signed Identity. Exact replay is idempotent; caller cannot supply identity_id.
      security:
        - ClientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMobileInstallationRequest'
      responses:
        '201':
          description: Installation registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInstallation'
        '200':
          description: Exact registration replay returned the existing installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInstallation'
        '400':
          description: Invalid installation input or conflicting reuse of an installation identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Push endpoint is active under another Identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Installation storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/mobile/installations/{installationID}/push-endpoint:
    patch:
      operationId: rotateMobilePushEndpoint
      description: Rotates the push endpoint of an ACTIVE installation owned by the signed Identity. Same-endpoint replay is idempotent.
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: installationID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateMobilePushEndpointRequest'
      responses:
        '200':
          description: Current installation snapshot after rotation or idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInstallation'
        '400':
          description: Invalid rotation or revoked installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Installation is absent or is not owned by the signed Identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Push endpoint is active under another Identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/mobile/installations/{installationID}/revoke:
    post:
      operationId: revokeMobileInstallation
      description: Revokes an installation owned by the signed Identity and clears its push endpoint. Replay is idempotent.
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: installationID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revoked installation snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInstallation'
        '404':
          description: Installation is absent or is not owned by the signed Identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Installation storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/products/{productID}/commercial-owner:
    patch:
      operationId: updateProductCommercialOwner
      description: HIGH_RISK product ownership mutation. Requires a fresh signed step-up assertion bound to the signed Identity.
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: productID
          required: true
          schema: { type: string }
        - in: header
          name: X-Correlation-Id
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCommercialOwnerRequest'
      responses:
        '200':
          description: Commercial owner changed after fresh step-up authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCommercialOwnerResponse'
        '404':
          description: Product is not owned by the signed Identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '428':
          description: Fresh step-up authentication is required; mutation is not performed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/organizations:
    get:
      operationId: listOrganizations
      description: Lists organizations visible to the signed Identity through ACTIVE membership.
      security:
        - ClientSession: []
      responses:
        '200':
          description: Organizations visible to the signed Identity
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationSnapshot'
    post:
      operationId: createOrganization
      description: Creates an Organization and atomically attaches the signed Identity as ACTIVE member and explicit ACTIVE owner. Creates a signed client session when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created with explicit ownership and membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSnapshot'
  /v1/organizations/{organizationID}:
    get:
      operationId: getOrganization
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Organization visible to an ACTIVE member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSnapshot'
        '404':
          description: Organization is absent or not visible to the signed Identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/organizations/{organizationID}/directions:
    post:
      operationId: createOrganizationDirection
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationDirectionRequest'
      responses:
        '201':
          description: Universal organization direction created by an ACTIVE owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSnapshot'
        '403':
          description: Active organization ownership is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/organizations/{organizationID}/directions/{directionID}/archive:
    post:
      operationId: archiveOrganizationDirection
      description: Archives a direction without deleting canonical or historical truth.
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string }
        - in: path
          name: directionID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Direction archived and preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSnapshot'
        '403':
          description: Active organization ownership is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/organizations/{organizationID}/products:
    get:
      operationId: listOrganizationProducts
      description: Lists canonical products owned by the Organization and visible through ACTIVE membership.
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Organization products with explicit ownership and revenue roles
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationProduct'
    post:
      operationId: createOrganizationProduct
      description: Creates an Organization-owned DRAFT product. Commercial owner, authors and revenue beneficiary are explicit request fields and are not inferred from owner_id.
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationProductRequest'
      responses:
        '201':
          description: Product draft created by an ACTIVE Organization owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProduct'
        '403':
          description: Active Organization ownership is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Direction is absent, archived, or belongs to another Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/organizations/{organizationID}/products/{productID}/publish:
    post:
      operationId: publishOrganizationProduct
      description: Publishes a product only after PostgreSQL validates explicit ownership/revenue roles and an ACTIVE direction owned by the same Organization.
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string }
        - in: path
          name: productID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Canonical PUBLISHED product with immutable publication audit evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProduct'
        '403':
          description: Active Organization ownership is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Product is not owned by the Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Product is already published or fails publication invariants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/organizations/{organizationID}/private-profile:
    get:
      operationId: getPrivateOrganizationProfile
      description: Protected tenant-scoped organization resource. X-Organization-Context is accepted only after active membership validation; cross-tenant access fails closed and is audited.
      security:
        - ClientSession: []
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string }
        - in: header
          name: X-Organization-Context
          required: true
          schema: { type: string }
        - in: header
          name: X-Correlation-Id
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Same-tenant private organization profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateOrganizationProfile'
        '403':
          description: Tenant context or cross-tenant authorization denied without resource disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/specialist/profile:
    get:
      operationId: getSpecialistProfile
      security:
        - ClientSession: []
      responses:
        '200':
          description: Current specialist profile bound to the signed Identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialistProfile'
        '404':
          description: Specialist profile has not been created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: upsertSpecialistProfile
      description: Creates a signed session when absent, or reuses the existing signed Identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialistProfileUpsertRequest'
      responses:
        '200':
          description: Durable specialist role and profile attached to the same Identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialistProfile'
  /v1/specialist/capabilities:
    post:
      operationId: declareSpecialistCapability
      security:
        - ClientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialistCapabilityRequest'
      responses:
        '200':
          description: Capability is declared without claiming verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialistProfile'
  /v1/specialist/evidence:
    post:
      operationId: submitSpecialistEvidence
      security:
        - ClientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialistEvidenceRequest'
      responses:
        '201':
          description: Evidence reference accepted for trusted review; capability remains unverified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialistProfile'
  /v1/specialist/publish:
    post:
      operationId: publishSpecialistCapability
      security:
        - ClientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialistCapabilityRequest'
      responses:
        '200':
          description: Verified capability published after profile review and QualificationPolicy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialistPublishResult'
        '409':
          description: Fail-closed publication gate with policy reason codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialistPublishResult'
  /v1/specialist/unpublish:
    post:
      operationId: unpublishSpecialistCapability
      security:
        - ClientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialistCapabilityRequest'
      responses:
        '200':
          description: Active capability publication ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialistPublishResult'
  /v1/help-intents:
    post:
      operationId: createHelpIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHelpIntentRequest'
      responses:
        '201':
          description: Draft HelpIntent awaiting user confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpIntent'
        '400':
          description: Free text is missing or unreadable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/help-intents/{id}/confirm:
    post:
      operationId: confirmHelpIntent
      security:
        - ClientSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmHelpIntentRequest'
      responses:
        '200':
          description: User-confirmed HelpIntent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpIntent'
        '400':
          description: Confirmation rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/search:
    get:
      operationId: searchProjection
      parameters:
        - name: topic
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Search projection for one topic. The index does not own qualification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchView'
  /v1/search/rebuild:
    post:
      operationId: rebuildSearchProjection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTopicRequest'
      responses:
        '200':
          description: Projection rebuilt from canonical specialist profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchView'
  /v1/search/stale:
    post:
      operationId: markSearchProjectionStale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchStaleRequest'
      responses:
        '200':
          description: Index lost an entry. Qualification truth is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchView'
  /v1/help-intents/{id}/matches:
    get:
      operationId: listHelpIntentMatches
      security:
        - ClientSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: topic
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Eligible ranked specialists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchList'
  /v1/specialists/{id}/slots:
    get:
      operationId: listSpecialistSlots
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Exclusive future slots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotList'
  /v1/slot-holds:
    post:
      operationId: acquireSlotHold
      security:
        - ClientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireSlotHoldRequest'
      responses:
        '201':
          description: Exclusive slot hold acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotHold'
        '409':
          description: Slot already held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/slot-holds/{id}/checkout-options:
    get:
      operationId: listCheckoutOptions
      security:
        - ClientSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: client_identity_id
          in: query
          required: false
          deprecated: true
          description: Compatibility assertion only. Authorization identity comes from the signed ClientSession cookie; a mismatch is denied.
          schema: { type: string }
      responses:
        '200':
          description: External payment methods. APGIC does not accept funds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOptionList'
  /v1/checkout-instructions:
    post:
      operationId: createCheckoutInstruction
      security:
        - ClientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutInstructionRequest'
      responses:
        '201':
          description: External execution instruction. APGIC does not accept funds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutInstruction'
        '409':
          description: Method is ineligible or custody is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/provider-events:
    post:
      operationId: applyProviderEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderEvent'
      responses:
        '201':
          description: First captured provider evidence. APGIC does not accept funds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEvidence'
        '200':
          description: Duplicate provider event with the same economic effect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEvidence'
        '409':
          description: Evidence does not match the instruction or would create a second effect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/legal-acceptances:
    post:
      operationId: recordLegalAcceptance
      security:
        - ClientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordLegalAcceptanceRequest'
      responses:
        '201':
          description: New immutable acceptance evidence recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalAcceptance'
        '200':
          description: Idempotent replay of an existing acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalAcceptance'
  /v1/legal-acceptances/{documentID}/{documentVersion}:
    get:
      operationId: getLegalAcceptanceStatus
      security:
        - ClientSession: []
      parameters:
        - name: documentID
          in: path
          required: true
          schema: { type: string }
        - name: documentVersion
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Acceptance status for exactly the requested document version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalAcceptanceStatus'
  /v1/account-deletions:
    post:
      operationId: deleteAccount
      security:
        - ClientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '201':
          description: Account deletion. Financial evidence is retained. Deactivation is not deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
  /v1/cancellations:
    post:
      operationId: cancelOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationRequest'
      responses:
        '201':
          description: Provider-executed cancellation. APGIC does not return funds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '200':
          description: Repeated cancellation of the same order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
  /v1/bookings/{id}/fulfillment:
    get:
      operationId: getBookingFulfillment
      security:
        - ClientSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: identity_id
          in: query
          required: false
          deprecated: true
          description: Compatibility assertion only. Authorization identity comes from the signed ClientSession cookie; a mismatch is denied.
          schema: { type: string }
      responses:
        '200':
          description: Transactional notice and communication join decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFulfillment'
  /v1/consultations/{bookingID}/presence:
    post:
      operationId: recordConsultationPresence
      parameters:
        - name: bookingID
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Provider lifecycle facts recorded. APGIC does not own the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationView'
  /v1/consultations/{bookingID}/failures:
    post:
      operationId: reportConsultationFailure
      parameters:
        - name: bookingID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationFailureRequest'
      responses:
        '201':
          description: Provider failure starts recovery or an external refund path. APGIC does not charge again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationView'
  /v1/consultations/{bookingID}/recovery:
    post:
      operationId: succeedConsultationRecovery
      parameters:
        - name: bookingID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationRecoveryRequest'
      responses:
        '201':
          description: Recovery returned the consultation to work without a second charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationView'
  /v1/consultations/{bookingID}/growth-export:
    post:
      operationId: exportConsultationToGrowth
      security:
        - ClientSession: []
      parameters:
        - name: bookingID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowthExportRequest'
      responses:
        '200':
          description: Minimal facts only. Raw consultation content is not included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthExport'
        '401':
          description: Trusted client session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The trusted client session does not own the booking/data subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Purpose consent is required for raw consultation content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/consultations/{bookingID}/complete:
    post:
      operationId: completeConsultation
      parameters:
        - name: bookingID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteConsultationRequest'
      responses:
        '201':
          description: Completed only with provider evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationView'
        '409':
          description: Completion evidence is missing or the session is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    ClientSession:
      type: apiKey
      in: cookie
      name: __Host-apgic_session
      description: Server-signed trusted client session. Caller-supplied identity fields are never an authorization source.
  schemas:
    Surface:
      type: string
      enum: [WEB, PWA, IOS, ANDROID]
    PaymentSelection:
      type: object
      additionalProperties: false
      required: [provider_id, method_code, rail_code]
