name: Academy branch source and visual evidence normalization
on:
  push:
    branches: [feat/academy-edtech]
    paths:
      - 'backend/internal/academy/**'
      - 'backend/internal/httpapi/academy*.go'
      - 'backend/internal/httpapi/handler.go'
      - 'backend/internal/runtimepostgres/academy*.go'
      - 'backend/cmd/api/main.go'
      - 'apps/web/app/page.tsx'
      - 'apps/web/app/academy/**'
      - 'apps/web/e2e/visual-regression.spec.ts'
      - 'apps/web/e2e/snapshots/**'
      - '.github/workflows/academy-source-visual-normalize.yml'
permissions:
  contents: write
concurrency:
  group: academy-normalize-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-normalization:
    if: github.ref == 'refs/heads/feat/academy-edtech'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Normalize only the Academy Go surface
        run: |
          set -euo pipefail
          gofmt -w backend/internal/academy/*.go backend/internal/httpapi/academy*.go backend/internal/httpapi/handler.go backend/internal/runtimepostgres/academy*.go backend/cmd/api/main.go
      - name: Install WEB and Chromium, then prove current responsive visual baselines
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test e2e/visual-regression.spec.ts --update-snapshots
      - name: Reject broad visual drift or unrelated file changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'href="/academy"' apps/web/app/page.tsx
          python3 - <<'PY'
          import subprocess,struct,pathlib
          def dimensions(data):
              assert data[:8]==b'\x89PNG\r\n\x1a\n','Screenshot not a PNG'
              return struct.unpack('>II',data[16:24])
          for name,width in [('phone',390),('tablet',768),('desktop',1440)]:
              path=f'apps/web/e2e/snapshots/{name}/{name}-critical-entry.png'
              previous=subprocess.check_output(['git','show',f'HEAD:{path}'])
              current=pathlib.Path(path).read_bytes()
              old_width,old_height=dimensions(previous)
              new_width,new_height=dimensions(current)
              assert old_width==new_width==width,(name,'unexpected viewport width')
              assert abs(new_height-old_height)<=80,(name,'unexpected page height drift',old_height,new_height)
              assert new_height>900,(name,'screenshot suspiciously truncated')
              print(f'{name}: reviewed {old_width}x{old_height} -> {new_width}x{new_height}')
          PY
          git add backend/internal/academy backend/internal/httpapi/academy.go backend/internal/httpapi/academy_test.go backend/internal/httpapi/handler.go backend/internal/runtimepostgres/academy.go backend/internal/runtimepostgres/academy_integration_test.go backend/cmd/api/main.go
          git add apps/web/e2e/snapshots/phone/phone-critical-entry.png apps/web/e2e/snapshots/tablet/tablet-critical-entry.png apps/web/e2e/snapshots/desktop/desktop-critical-entry.png
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          if [ -z "$changed" ]; then echo 'No normalization needed on HEAD'; exit 0; fi
          if printf '%s\n' "$changed" | grep -Ev '^(backend/internal/academy/.*\.go|backend/internal/httpapi/(academy.*\.go|handler\.go)|backend/internal/runtimepostgres/academy.*\.go|backend/cmd/api/main\.go|apps/web/e2e/snapshots/(phone|tablet|desktop)/.*-critical-entry\.png)$'; then
            echo 'Refusing non-Academy normalization changes'
            exit 1
          fi
          git fetch --no-tags origin feat/academy-edtech
          test "$(git rev-parse refs/remotes/origin/feat/academy-edtech)" = "$GITHUB_SHA"
          git config user.name 'apgic-academy-verified-normalizer'
          git config user.email 'apgic-academy-verified-normalizer@users.noreply.github.com'
          git commit -m 'chore(academy): verify Go source formatting and update reviewed responsive visual evidence'
          git push origin HEAD:refs/heads/feat/academy-edtech
      - name: Preserve baseline provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: academy-responsive-baseline-evidence-${{ github.run_id }}
          path: apps/web/e2e/snapshots/
          retention-days: 30
