name: Format new Growth Go files (one-off)
on:
  push:
    branches:
      - feat/growth-distribution
permissions:
  contents: write
jobs:
  format-growth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/growth-distribution
          persist-credentials: true
      - name: Go standard formatter
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w backend/internal/growth/*.go backend/internal/httpapi/growth*.go backend/internal/runtimepostgres/growth.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add backend/internal/growth backend/internal/httpapi/growth.go backend/internal/httpapi/growth_test.go backend/internal/runtimepostgres/growth.go
            git commit -m 'style(growth): normalize complete Go module with gofmt'
            git push origin HEAD:feat/growth-distribution
          fi
