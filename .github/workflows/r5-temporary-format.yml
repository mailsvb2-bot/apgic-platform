name: R5 temporary Go formatting
on:
  push:
    branches: [feat/r5-deletion-lifecycle-core-20261027]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r5-deletion-lifecycle-core-20261027
          persist-credentials: true
      - name: Format feature-branch Go code without bypassing CI
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.go' | xargs -r gofmt -w
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.go'
            git commit -m "style(R5): gofmt canonical deletion lifecycle source"
            git push origin HEAD:refs/heads/feat/r5-deletion-lifecycle-core-20261027
          fi
