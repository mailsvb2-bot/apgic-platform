name: R8 real Yandex provider acceptance (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type LIVE to confirm the selected branch contains R8 real-provider tests"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: r8-real-yandex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-yandex-gateway:
    name: Real Yandex media range and revocation smoke
    # This job deliberately has no fake/sandbox fallback or automatic trigger.
    # It proves only provider bytes and gateway copier behavior, not PSP,
    # real author/learner browser identity or PostgreSQL entitlement revocation.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APGIC_REQUIRE_R8_LIVE_PROOF: "true"
      APGIC_TEST_YANDEX_OAUTH_TOKEN: ${{ secrets.APGIC_TEST_YANDEX_OAUTH_TOKEN }}
      APGIC_TEST_YANDEX_VIDEO_PATH: ${{ secrets.APGIC_TEST_YANDEX_VIDEO_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Require deliberate LIVE confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "LIVE" ]; then
            echo "::error::Live evidence requires explicit LIVE confirmation; a skipped job is not acceptance."
            exit 1
          fi
      - name: Require real provider inputs (never print secrets)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APGIC_TEST_YANDEX_OAUTH_TOKEN:-}" ] || [ -z "${APGIC_TEST_YANDEX_VIDEO_PATH:-}" ]; then
            echo "::error::R8 live provider credentials or an author-owned test video are not configured; this run is NOT accepted."
            exit 1
          fi
      - name: Require all three live tests to exist in selected commit
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          # 'go test -run' returns success when no test names match. Reject
          # that false-positive (including accidental workflow runs on main).
          academy_tests="$(go test ./internal/academy -list '^TestLive' 2>&1)"
          http_tests="$(go test ./internal/httpapi -list '^TestLive' 2>&1)"
          printf '%s\n' "$academy_tests" | grep -Fxq 'TestLiveYandexVerifiedVideoRange' || {
            echo "::error::Selected commit does not contain the real-provider range test"
            exit 1
          }
          for name in TestLiveAcademyYandexGatewaySeekAndRevocation TestLiveAcademyYandexGatewayStopsInFlightAfterRevocation; do
            printf '%s\n' "$http_tests" | grep -Fxq "$name" || {
              echo "::error::Selected commit is missing an obligatory real gateway test"
              exit 1
            }
          done
      - name: Run only mandatory real provider media checks
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          go test ./internal/academy ./internal/httpapi \
            -run '^TestLive(YandexVerifiedVideoRange|AcademyYandexGatewaySeekAndRevocation|AcademyYandexGatewayStopsInFlightAfterRevocation)$' \
            -count=1 -timeout=10m
      - name: Record bounded live-provider evidence
        if: success()
        shell: bash
        env:
          R8_CANDIDATE_SHA: ${{ github.sha }}
          R8_RUN_ID: ${{ github.run_id }}
          R8_RUN_ATTEMPT: ${{ github.run_attempt }}
          R8_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Only runs after all three live-provider tests have passed.
          # Never serialize secrets, media paths, OAuth tokens or temporary URLs.
          evidence = {
              "schema_version": "r8-live-provider-smoke-v1",
              "candidate_sha": os.environ["R8_CANDIDATE_SHA"],
              "repository": os.environ["R8_REPOSITORY"],
              "workflow_run_id": int(os.environ["R8_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["R8_RUN_ATTEMPT"]),
              "result": "PASS",
              "scope": "real_yandex_provider_byte_range_and_gateway_revocation_smoke",
              "required_tests": [
                  "TestLiveYandexVerifiedVideoRange",
                  "TestLiveAcademyYandexGatewaySeekAndRevocation",
                  "TestLiveAcademyYandexGatewayStopsInFlightAfterRevocation",
              ],
              "release_authorized": False,
              "not_proven": [
                  "signed_author_and_learner_browser_sessions",
                  "postgresql_persisted_entitlement_revocation",
                  "externally_captured_psp_payment",
                  "finance_reconciliation",
                  "real_device_playback",
              ],
          }
          Path("evidence/r8-live-provider-smoke.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )
          PY
      - name: Upload exact-SHA live-provider smoke evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: r8-live-provider-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/r8-live-provider-smoke.json
          if-no-files-found: error
          retention-days: 90
      - name: Identify exact tested candidate
        if: success()
        shell: bash
        run: |
          echo "R8 live provider smoke PASSED for commit ${GITHUB_SHA}."
          echo "This does not certify signed users, real PSP capture, entitlement storage/revocation, or release approval."
