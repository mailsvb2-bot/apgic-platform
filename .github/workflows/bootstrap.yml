name: Bootstrap R0 foundation

on:
  push:
    branches:
      - feat/r0-foundation-bootstrap
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/r0-foundation-bootstrap
          fetch-depth: 0

      - name: Expand verified bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk.* | base64 -d > /tmp/apgic-bootstrap.tar.gz
          tar -xzf /tmp/apgic-bootstrap.tar.gz -C .

          # Workflow mutations are finalized through the GitHub connector,
          # not through GITHUB_TOKEN. Keep bootstrap.yml and omit ci.yml here.
          rm -f .github/workflows/ci.yml
          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi

          git commit -m "feat: bootstrap APGIC R0 foundation from v7 canon"
          git push origin HEAD:feat/r0-foundation-bootstrap
