name: Cross-lane integration / release blockers

on:
  push:
    branches:
      - feat/platform-readiness
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Exact GitHub branch holding combined integration candidate (defaults to readiness for visibility only)"
        required: true
        default: feat/platform-readiness
        type: string

permissions:
  contents: read

concurrency:
  group: integration-control-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  integration:
    name: Cross-lane owner/blocker report (NOT release authorization)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run evidence/report contract tests
        run: python -m unittest discover -s tools/tests -p test_integration_release_control.py -v
      - name: Read pinned branch heads and report conflicts
        id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ inputs.candidate_ref || 'feat/platform-readiness' }}
        shell: bash
        run: |
          set +e
          python tools/integration_release_control.py \
            --candidate-ref "$CANDIDATE_REF" \
            --output evidence/integration-branch-control.json \
            --summary "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          # An explicit BLOCKED decision is a useful artifact, not a failing
          # unit test or a successfully approved release. Publish it first.
          if [ "$status" -eq 2 ]; then
            echo 'Integration candidate is BLOCKED; inspect owner-specific report.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
      - name: Persist exact observed blockers and branch SHAs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-blockers-${{ github.sha }}-${{ github.run_id }}
          path: evidence/integration-branch-control.json
          if-no-files-found: error
          retention-days: 90
