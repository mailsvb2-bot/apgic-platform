  web-build:
    name: Web / Next.js production build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - working-directory: apps/web
        run: npm install --ignore-scripts --no-audit --no-fund
      - working-directory: apps/web
        run: npm test
      - name: Prove Web/iOS/Android analytics semantic parity
        run: node tools/r1_analytics_parity_e2e.mjs
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npm run build
      - run: git diff --exit-code -- apps/web/tsconfig.json
      - working-directory: apps/web
        run: npm run test:e2e

  mobile-typecheck:
    name: Native / React Native typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - working-directory: apps/mobile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate installed mobile dependency SBOM
        working-directory: apps/mobile
        shell: bash
        run: |
          mkdir -p ../../evidence
          npm ls --json --all > ../../evidence/mobile-npm-tree.json
          python ../../tools/mobile_sbom.py \
            --tree ../../evidence/mobile-npm-tree.json \
            --output ../../evidence/mobile-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-cyclonedx-sbom
          path: |
            evidence/mobile-sbom.cdx.json
            evidence/mobile-npm-tree.json
          if-no-files-found: error
          retention-days: 30
      - working-directory: apps/mobile
        run: npx tsc --noEmit
      - working-directory: apps/mobile
        run: npm test

  mobile-android-build:
    name: Android native debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="27.1.12297006"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          for attempt in 1 2 3; do
            echo "Installing pinned Android NDK $NDK_VERSION (attempt $attempt/3)"
            rm -rf "$NDK_DIR"
            rm -rf "$SDK_ROOT/.temp"/* 2>/dev/null || true
            if "$SDKMANAGER" "ndk;$NDK_VERSION" &&
               test -f "$NDK_DIR/source.properties" &&
               grep -q "Pkg.Revision = $NDK_VERSION" "$NDK_DIR/source.properties"; then
              exit 0
            fi
            rm -rf "$NDK_DIR"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Failed to install verified Android NDK $NDK_VERSION after 3 attempts" >&2
          exit 1
      - working-directory: apps/mobile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Android debug artifact
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT

          for attempt in 1 2 3; do
            echo "Android Gradle build attempt $attempt/3"
            if ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$log_file"; then
              exit 0
            fi

            if ! grep -Eq               "could not resolve plugin artifact|Could not resolve|Could not GET|Could not HEAD|Read timed out|Connection reset|Connection refused|Temporary failure|plugins.gradle.org|gradlePluginPortal"               "$log_file"; then
              echo "Android build failed for a non-network reason; refusing retry." >&2
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "Android dependency/plugin resolution failed after 3 attempts." >&2
          exit 1
      - shell: bash
        run: |
          mkdir -p evidence
          test -f apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          MERGED_MANIFEST="$(find apps/mobile/android/app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/(merged_manifest|merged_manifests)/debug/' | head -n1)"
          test -n "$MERGED_MANIFEST"
          python tools/mobile_build_privacy_inspection.py             --android-manifest "$MERGED_MANIFEST"             --android-data-safety apps/mobile/android/data-safety.yaml             --output evidence/android-build-privacy-inspection.json
          sha256sum apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk > evidence/android-debug.sha256
      - name: Prove native capability and installation lifecycle on Android emulator
        shell: bash
        run: bash tools/mobile_android_capability_e2e.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-native-debug-build
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            evidence/android-debug.sha256
            evidence/android-build-privacy-inspection.json
            evidence/android-capability-e2e-*.xml
            evidence/android-compatibility-supported.xml
            evidence/android-compatibility-update-required.xml
            evidence/android-remote-config-network.xml
            evidence/android-remote-config-last-known-safe.xml
            evidence/android-installation-e2e.xml
            evidence/android-installation-server-state.json
            evidence/android-deeplink-issued.json
            evidence/android-deeplink-e2e.xml
            evidence/android-notification-e2e.xml
            evidence/android-offline-mutation-pending.xml
            evidence/android-offline-mutation-confirmed.xml
            evidence/android-offline-mutation-server-replay.json
            evidence/android-offline-hold.json
            evidence/android-realtime-e2e.xml
            evidence/android-realtime-rejoin.xml
            evidence/android-accessibility-e2e.xml
            evidence/android-a11y-*.xml
            evidence/android-device-matrix.json
          if-no-files-found: error
          retention-days: 30

  mobile-ios-build:
    name: iOS native simulator build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - working-directory: apps/mobile
        run: npm install --ignore-scripts --no-audit --no-fund
      - working-directory: apps/mobile/ios
        run: pod install
      - working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace APGIC.xcworkspace \
            -scheme APGIC \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY=- \
            build
      - name: Verify Xcode simulator signing before Keychain runtime proof
        shell: bash
        run: |
          mkdir -p evidence
          APP="apps/mobile/ios/build/derived/Build/Products/Debug-iphonesimulator/APGIC.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          codesign --display --verbose=4 "$APP" > evidence/ios-simulator-codesign.txt 2>&1
          codesign --display --entitlements :- "$APP" > evidence/ios-simulator-entitlements.plist 2>/dev/null
          grep -q 'Signature=adhoc' evidence/ios-simulator-codesign.txt
      - shell: bash
        run: |
          mkdir -p evidence
          APP="apps/mobile/ios/build/derived/Build/Products/Debug-iphonesimulator/APGIC.app"
          test -d "$APP"
          python tools/mobile_build_privacy_inspection.py             --ios-app "$APP"             --canonical-ios-manifest apps/mobile/ios/APGIC/PrivacyInfo.xcprivacy             --output evidence/ios-build-privacy-inspection.json
          ditto -c -k --keepParent "$APP" evidence/APGIC-ios-simulator.zip
          shasum -a 256 evidence/APGIC-ios-simulator.zip > evidence/ios-simulator.sha256
      - name: Prove native capability and installation lifecycle on iOS Simulator
        shell: bash
        run: bash tools/mobile_ios_capability_e2e.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ios-native-simulator-build
          path: |
            evidence/APGIC-ios-simulator.zip
            evidence/ios-simulator.sha256
            evidence/ios-build-privacy-inspection.json
            evidence/ios-simulator-codesign.txt
            evidence/ios-simulator-entitlements.plist
            evidence/ios-capability-e2e-*.json
            evidence/ios-compatibility-supported.json
            evidence/ios-compatibility-update-required.json
            evidence/ios-remote-config-network.json
            evidence/ios-remote-config-last-known-safe.json
            evidence/ios-installation-e2e.json
            evidence/ios-installation-server-state.json
            evidence/ios-deeplink-issued.json
            evidence/ios-deeplink-e2e.json
            evidence/ios-notification-e2e.json
            evidence/ios-offline-mutation-pending.json
            evidence/ios-offline-mutation-confirmed.json
            evidence/ios-offline-mutation-server-replay.json
            evidence/ios-offline-hold.json
            evidence/ios-realtime-e2e.json
            evidence/ios-realtime-rejoin.json
            evidence/ios-accessibility-e2e.json
            evidence/ios-accessibility-large-text.json
          if-no-files-found: error
          retention-days: 30

  client-contract-presence:
    name: Multi-surface contract guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          test -f contracts/openapi/apgic-v1.yaml
          test -f apps/web/package.json
          test -f apps/mobile/package.json
          test -f packages/contracts/src/index.ts
          test -f packages/contracts/src/generated/apgic-v1.ts
          test -f apps/web/src/api-contract.ts
          test -f apps/mobile/src/api-contract.ts
          grep -q '"next": "16.3.6"' apps/web/package.json
          grep -q '"react-native": "0.87.1"' apps/mobile/package.json

  r0-gate:
    name: R0 bootstrap gate
    if: ${{ always() && !cancelled() }}
    needs: [canon, backend, postgres-invariants, restore-drill, web-build, mobile-typecheck, mobile-android-build, mobile-ios-build, client-contract-presence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          test "${{ needs.canon.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.postgres-invariants.result }}" = "success"
          test "${{ needs.restore-drill.result }}" = "success"
          test "${{ needs.web-build.result }}" = "success"
          test "${{ needs.mobile-typecheck.result }}" = "success"
          test "${{ needs.mobile-android-build.result }}" = "success"
          test "${{ needs.mobile-ios-build.result }}" = "success"
          test "${{ needs.client-contract-presence.result }}" = "success"
      - shell: bash
        run: |
          python tools/release_evidence.py             --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"             --output evidence/r0-release-evidence.json             --gate "canon=${{ needs.canon.result }}"             --gate "backend=${{ needs.backend.result }}"             --gate "postgres-invariants=${{ needs.postgres-invariants.result }}"             --gate "restore-drill=${{ needs.restore-drill.result }}"             --gate "web-build=${{ needs.web-build.result }}"             --gate "mobile-typecheck=${{ needs.mobile-typecheck.result }}"             --gate "android-native-build=${{ needs.mobile-android-build.result }}"             --gate "ios-native-build=${{ needs.mobile-ios-build.result }}"             --gate "client-contract-presence=${{ needs.client-contract-presence.result }}"
      - uses: actions/upload-artifact@v7
        with:
          name: r0-release-evidence
          path: evidence/r0-release-evidence.json
          if-no-files-found: error
          retention-days: 30
