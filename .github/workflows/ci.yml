name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  # Push and pull_request runs for the same branch are independent gates.
  # A newer run only supersedes an older run of the same event type.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  canon:
    name: Canon / architecture conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/canon_lint.py
      - run: python tools/canon_freeze_contract_guard.py
      - run: python tools/architecture_guard.py
      - run: python tools/restore_evidence_contract_guard.py
      - run: python tools/ui_adaptive_contract_guard.py
      - run: python tools/accessibility_contract_guard.py
      - run: python tools/staging_boundary_guard.py
      - run: python tools/staging_backup_guard.py
      - run: python tools/staging_runtime_watchdog_guard.py
      - run: python tools/staging_runtime_evidence_guard.py
      - run: python tools/staging_migration_contract_guard.py
      - shell: bash
        run: |
          bash -n deploy/staging/update-staging.sh
          bash -n deploy/staging/apply-staging-migrations.sh
          bash -n deploy/staging/test-staging-migration-ledger.sh
          python tools/staging_update_guard.py
          python -m py_compile deploy/staging/prove-mobile-realtime.py
      - run: python tools/dedicated_host_bootstrap_guard.py
      - run: python tools/identity_contract_guard.py
      - run: python tools/auth_contract_guard.py
      - run: python tools/connector_contract_guard.py
      - run: python tools/organization_contract_guard.py
      - run: python tools/security_contract_guard.py
      - run: python tools/service_credential_contract_guard.py
      - run: python tools/client_credential_guard.py
      - run: python tools/mobile_installation_contract_guard.py
      - run: python tools/mobile_deeplink_contract_guard.py
      - run: python tools/mobile_storage_contract_guard.py
      - run: python tools/mobile_native_storage_audit.py
      - run: python tools/repository_secret_scan.py
      - run: python tools/legal_snapshot_contract_guard.py
      - run: python tools/legal_acceptance_contract_guard.py
      - run: python tools/mobile_capability_contract_guard.py
      - name: Validate native capability E2E harness syntax
        shell: bash
        run: |
          bash -n tools/mobile_android_capability_e2e.sh
          bash -n tools/mobile_ios_capability_e2e.sh
          test -f backend/internal/runtimepostgres/mobile_installation_test.go
          grep -q 'POST /v1/mobile/installations' backend/internal/httpapi/mobile_installation.go
      - run: python tools/event_contract_guard.py
      - run: python tools/audit_contract_guard.py
      - run: python tools/ledger_contract_guard.py
      - run: python tools/product_contract_guard.py
      - run: python tools/payment_custody_guard.py
      - run: python tools/payment_taxonomy_architecture_guard.py
      - run: python tools/mobile_dependency_guard.py
      - run: python tools/mobile_dependency_contract_guard.py
      - run: python tools/mobile_privacy_guard.py
      - run: python tools/mobile_privacy_contract_guard.py
      - run: python tools/terminology_guard.py
      - run: python tools/generate_client_contract.py --check
      - run: python tools/multisurface_guard.py
      - run: python tools/multisurface_verification_e2e.py
      - run: python tools/r1_multisurface_guard.py
      - run: python tools/mobile_support_guard.py config/mobile/r1-ci-support-policy.yaml --mode ci
      - run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - run: python tools/test_canon_contract_guard.py
      - run: python tools/jurisdiction_contract_guard.py
      - run: python tools/retention_contract_guard.py
      - run: python tools/provider_matrix_contract_guard.py
      - run: python tools/launch_config_guard.py config/launch.ci.yaml --mode ci
      - run: python tools/launch_config_guard.py config/launch.r1-ci.yaml --mode ci --profile R1
      - run: python tools/launch_config_guard.py config/launch.r2-ci.yaml --mode ci --profile R2
      - run: python tools/launch_config_guard.py config/launch.r3-ci.yaml --mode ci --profile R3
      - run: python tools/launch_config_guard.py config/launch.r4-ci.yaml --mode ci --profile R4
      - run: python tools/launch_config_guard.py config/launch.r5-ci.yaml --mode ci --profile R5
      - run: python tools/mobile_release_guard.py config/mobile/r0-ci-release-governance.yaml --mode ci
      - run: python tools/mobile_native_build_guard.py config/mobile/r0-ci-release-governance.yaml
      - run: python tools/mobile_observability_guard.py config/mobile/r0-ci-observability.yaml --mode ci
      - run: python tools/mobile_performance_gate.py config/mobile/r0-ci-observability.yaml config/mobile/r0-ci-performance-pass.yaml
      - shell: bash
        run: |
          if python tools/mobile_performance_gate.py config/mobile/r0-ci-observability.yaml config/mobile/r0-ci-performance-breach.yaml; then
            echo "breached mobile performance sample unexpectedly passed" >&2
            exit 1
          fi
          echo "fail-closed mobile performance breach proof: PASS"
      - run: python tools/mobile_realtime_guard.py config/mobile/r3-ci-realtime-policy.yaml --mode ci
      - run: python tools/r4_release_gate.py config/release/r4-ci-gate-evidence.yaml --gate all --mode ci
      - shell: bash
        run: |
          if python tools/launch_config_guard.py config/launch.example.yaml --mode production; then
            echo "production placeholder config unexpectedly passed" >&2
            exit 1
          fi
          echo "fail-closed production preflight proof: PASS"
          if python tools/launch_config_guard.py config/launch.r1.example.yaml --mode production --profile R1; then
            echo "R1 production placeholder config unexpectedly passed" >&2
            exit 1
          fi
          echo "fail-closed R1 MarketCell preflight proof: PASS"
          if python tools/launch_config_guard.py config/launch.r2.example.yaml --mode production --profile R2; then
            echo "R2 production pricing/commission placeholder unexpectedly passed" >&2
            exit 1
          fi
          echo "fail-closed R2 pricing/commission preflight proof: PASS"
          if python tools/launch_config_guard.py config/launch.r3.example.yaml --mode production --profile R3; then
            echo "R3 production booking fulfillment placeholder unexpectedly passed" >&2
            exit 1
          fi
          echo "fail-closed R3 booking fulfillment preflight proof: PASS"
          if python tools/launch_config_guard.py config/launch.r4.example.yaml --mode production --profile R4; then
            echo "R4 production provider settlement placeholder unexpectedly passed" >&2
            exit 1
          fi
          echo "fail-closed R4 provider settlement preflight proof: PASS"
          if python tools/r4_release_gate.py config/release/r4-ci-gate-evidence.yaml --gate all --mode production; then
            echo "synthetic R4 evidence unexpectedly passed production gate" >&2
            exit 1
          fi
          echo "fail-closed R4 synthetic evidence production proof: PASS"
          if python tools/r4_release_gate.py config/release/r4-production-evidence.example.yaml --gate all --mode production; then
            echo "empty R4 production evidence unexpectedly passed" >&2
            exit 1
          fi
          echo "fail-closed R4 missing production evidence proof: PASS"
          if python tools/mobile_support_guard.py config/mobile/support-policy.example.yaml --mode production; then
            echo "production mobile support placeholder unexpectedly passed" >&2
            exit 1
          fi
          echo "fail-closed production mobile support proof: PASS"
          if python tools/mobile_release_guard.py config/mobile/release-governance.example.yaml --mode production; then
            echo "production mobile release placeholder unexpectedly passed" >&2
            exit 1
          fi
          echo "fail-closed production mobile release proof: PASS"

  backend:
    name: Go format / vet / race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.mod
      - working-directory: backend
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            printf '%s\n' "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          go vet ./...
          go test -race ./...
      - name: Drill signed mobile emergency kill switch
        working-directory: backend
        run: go test ./internal/remoteconfig -run TestEmergencyKillSwitchDrill -count=1 -v

  postgres-invariants:
    name: PostgreSQL migration / invariant proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apgic
          POSTGRES_PASSWORD: apgic
          POSTGRES_DB: apgic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apgic -d apgic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: apgic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - shell: bash
        run: |
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000001_r0_foundation.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000002_legal_acceptance_mobile_installation.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000003_r0_semantic_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000004_r0_outbox_terminality.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000005_r0_legal_transaction_snapshot.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000006_r1_account_deletion.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000007_r1_marketplace_discovery.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000008_r2_booking_order.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000009_r2_payment_control_plane.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000010_r2_refund_reversal.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000011_r2_transaction_edge.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000012_r2_payment_governance.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000013_r2_mobile_store_entitlements.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000014_r3_communication_consultation.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000015_r4_store_lifecycle_reconciliation.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000016_r0_connector_delivery_semantics.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000017_r0_ledger_economic_event_idempotency.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000018_r0_order_product_ownership_snapshot.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000019_r1_specialist_supply_runtime.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000020_r0_organization_direction_runtime.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000021_r0_organization_history_links.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000022_r0_connector_atomic_application.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000023_r0_product_runtime.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000024_r0_published_product_order_gate.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000025_r2_notification_policy_runtime.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000026_r2_offline_mutation_failure.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/000027_r0_order_snapshot_baseline_repair.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r0_connector_delivery_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r1_mobile_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r1_marketplace_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r2_booking_order_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r2_payment_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r2_transaction_edge_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r2_payment_governance_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r2_mobile_store_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r3_communication_consultation_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r4_store_lifecycle_invariants.sql
          psql -h 127.0.0.1 -U apgic -d apgic_ci -v ON_ERROR_STOP=1 -f backend/migrations/ci_r2_refund_invariants.sql
          APGIC_DATABASE_URL='postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable' \
            bash deploy/staging/test-staging-migration-ledger.sh
          PGHOST=127.0.0.1 PGUSER=apgic PGDATABASE=apgic_ci bash backend/ci/r0_order_snapshot_baseline_repair.sh
          bash backend/ci/r2_booking_concurrency.sh
          bash backend/ci/r2_mutation_concurrency.sh
      - name: Prove runtime ledger persists and replays from PostgreSQL
        working-directory: backend
        env:
          APGIC_LEDGER_STORE_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestLedgerStorePersistsAndReplays -count=1
      - name: Prove transactional outbox survives rollback restart and retry
        working-directory: backend
        env:
          APGIC_OUTBOX_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestTransactionalOutboxSurvivesRollbackRestartAndRetry -count=1
      - name: Prove core business truth survives unavailable communication provider
        working-directory: backend
        env:
          APGIC_JOURNEY_STORE_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestCoreJourneyContinuesWithCommunicationProviderUnavailable -count=1
      - name: Prove provider brand stays behind canonical capability boundary
        working-directory: backend
        env:
          APGIC_CONNECTOR_DELIVERY_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestConnectorPersistenceKeepsProviderKindBehindCanonicalCapability -count=1
      - name: Prove connector webhook business effects are atomic and exactly once
        working-directory: backend
        env:
          APGIC_CONNECTOR_DELIVERY_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestConnectorWebhookAppliesBusinessEffectExactlyOnceAcrossOutOfOrderAndRetry -count=1
      - name: Prove authorization audit evidence persists in PostgreSQL
        working-directory: backend
        env:
          APGIC_AUDIT_STORE_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestAuditAppenderPersistsAuthorizationEvidence -count=1
      - name: Prove cross-tenant denial persists authorization evidence
        working-directory: backend
        env:
          APGIC_AUTHZ_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestAuthorizationEvaluatorPersistsCrossTenantDenial -count=1
      - name: Prove AUTH-001 protected HTTP tenant isolation and audit
        working-directory: backend
        env:
          APGIC_AUTHZ_HTTP_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/httpapi -run TestCrossTenantOrganizationHTTPDeniesWithoutDisclosureAndAudits -count=1
      - name: Prove organization direction history and explicit product publication
        working-directory: backend
        env:
          APGIC_ORGANIZATION_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/httpapi -run 'TestOrganizationDirectionHTTPPersistsOwnershipAndArchivesInsteadOfDelete|TestOrganizationProductHTTPPublishesExplicitOwnershipSnapshot' -count=1
      - name: Prove AUTH-002 high-risk step-up gate and audit
        working-directory: backend
        env:
          APGIC_AUTHZ_HTTP_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/httpapi -run TestHighRiskProductOwnershipRequiresFreshStepUpAndAudits -count=1
      - name: Prove high-risk ownership mutation and audit are atomic
        working-directory: backend
        env:
          APGIC_AUTHZ_HTTP_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestProductOwnershipMutationAndAuditAreAtomic -count=1
      - name: Prove booking journey survives PostgreSQL-backed restart
        working-directory: backend
        env:
          APGIC_JOURNEY_STORE_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run 'TestJourneyCheckoutRejectsDraftProductWithoutSideEffects|TestJourneyStoreSurvivesServiceRestart' -count=1
      - name: Prove versioned legal acceptance through trusted session and PostgreSQL
        working-directory: backend
        env:
          APGIC_LEGAL_ACCEPTANCE_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestLegalAcceptanceHTTPPreservesVersionHistory -count=1
      - name: Prove one durable identity keeps multiple roles
        working-directory: backend
        env:
          APGIC_IDENTITY_ROLE_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run 'TestIdentityRoleGrantKeepsSingleAccountTruth|TestIdentityRoleGrantRejectsUnknownAccountAndRole' -count=1
      - name: Prove trusted client session becomes specialist on one durable identity
        working-directory: backend
        env:
          APGIC_IDENTITY_HTTP_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/httpapi -run TestDurableClientBecomesSpecialistOnSameTrustedIdentity -count=1
      - name: Prove APGIC-MOBILE-028 role switching and foreign workspace denial
        working-directory: backend
        env:
          APGIC_IDENTITY_HTTP_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/httpapi -run TestMobileWorkspaceHTTPSwitchesOneIdentityAcrossRolesAndDeniesForeignWorkspace -count=1
      - name: Prove specialist evidence review and publish gate
        working-directory: backend
        env:
          APGIC_SPECIALIST_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestSpecialistSupplyPersistsEvidenceReviewAndPublishGate -count=1
      - name: Prove APGIC-MOBILE-013 contract compatibility and governed forced update
        working-directory: backend
        run: go test ./internal/clientcompat ./internal/httpapi -run 'TestCompatibility|TestSupportedPreviousContract|TestUnsupportedContract|TestMobileCompatibility' -count=1
      - name: Prove mobile installation rotation reinstall and revoke through PostgreSQL HTTP
        working-directory: backend
        env:
          APGIC_MOBILE_INSTALLATION_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestMobileInstallationHTTPPreservesIdentityAcrossRotationReinstallAndRevoke -count=1
      - name: Prove notification push parity idempotency audit and ownership
        working-directory: backend
        env:
          APGIC_NOTIFICATION_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestNotificationTransportClaimIsIdempotentAuditedAndOwned -count=1
      - name: Prove durable client mutation applied failed conflict and replay outcomes
        working-directory: backend
        env:
          APGIC_CLIENT_MUTATION_TEST_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_ci?sslmode=disable
        run: go test ./internal/runtimepostgres -run TestClientMutationPersistsAppliedFailedAndConflictOutcomes -count=1
      - name: Prove staging API requires PostgreSQL readiness
        working-directory: backend
        shell: bash
        env:
          APGIC_ENVIRONMENT: STAGING
          APGIC_HTTP_ADDR: 127.0.0.1:43111
          APGIC_DATABASE_URL: postgres://apgic:apgic@127.0.0.1:5432/apgic_mobile009_staging?sslmode=disable
          APGIC_JURISDICTION_MATRIX_VERSION: jurisdiction-ci-v1
          APGIC_RETENTION_POLICY_VERSION: retention-ci-v1
          APGIC_SLO_POLICY_VERSION: slo-r0-ci-v1
          APGIC_PROVIDER_MATRIX_VERSION: providers-ci-v1
          APGIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APGIC_CLIENT_SESSION_KEY: ci-only-client-session-key-000000000000
          APGIC_MOBILE_POLICY_VERSION: mobile013-ci-v1
          APGIC_MOBILE_CONTRACT_VERSION: 0.10.0-r0-remote-config
          APGIC_MOBILE_SUPPORTED_CONTRACTS: 0.8.0-r2-offline-sync,0.9.0-r0-mobile-compatibility,0.10.0-r0-remote-config
          APGIC_REMOTE_CONFIG_KEY_ID: mobile027-ci-v1
          APGIC_REMOTE_CONFIG_VERSION: 1
          APGIC_REMOTE_CONFIG_POLICY_ID: mobile027-ci-v1
          APGIC_REMOTE_CONFIG_TTL_SECONDS: 3600
          APGIC_REMOTE_CONFIG_DISABLED_CAPABILITIES:
          APGIC_MOBILE_FORCED_UPDATE_REASON: INCOMPATIBLE_CRITICAL
          APGIC_IOS_MIN_VERSION: 1.4.0
          APGIC_IOS_RECOMMENDED_VERSION: 1.6.0
          APGIC_IOS_MIN_BUILD: 1
          APGIC_IOS_UPDATE_URL: https://apgic.ru/update
          APGIC_ANDROID_MIN_VERSION: 1.4.0
          APGIC_ANDROID_RECOMMENDED_VERSION: 1.6.0
          APGIC_ANDROID_MIN_BUILD: 1
          APGIC_ANDROID_UPDATE_URL: https://apgic.ru/update
        run: |
          set -euo pipefail
          export APGIC_REMOTE_CONFIG_PRIVATE_KEY_BASE64="$(python3 -c 'import base64; print(base64.b64encode(b"r"*32).decode())')"
          psql -h 127.0.0.1 -U apgic -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE apgic_mobile009_staging'
          for migration in migrations/[0-9][0-9][0-9][0-9][0-9][0-9]_*.sql; do
            psql "$APGIC_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          go build -o /tmp/apgic-api ./cmd/api
          /tmp/apgic-api >/tmp/apgic-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:43111/readyz | grep -q '"status":"ready"'; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:43111/readyz | grep -q '"status":"ready"'
          python ../deploy/staging/prove-mobile-realtime.py \
            --base-url http://127.0.0.1:43111 \
            --output ../evidence/mobile009-staging-realtime.json
          kill "$api_pid"
          wait "$api_pid" 2>/dev/null || true
          trap - EXIT
          if APGIC_DATABASE_URL='postgres://invalid@127.0.0.1:1/invalid?sslmode=disable'              APGIC_HTTP_ADDR=127.0.0.1:43112              /tmp/apgic-api >/tmp/apgic-api-negative.log 2>&1; then
            echo "staging API unexpectedly started without PostgreSQL" >&2
            exit 1
          fi
          grep -q 'PostgreSQL readiness failed' /tmp/apgic-api-negative.log
      - name: Upload MOBILE-009 staging realtime evidence
        uses: actions/upload-artifact@v7
        with:
          name: mobile009-staging-realtime-evidence
          path: evidence/mobile009-staging-realtime.json
          if-no-files-found: error
          retention-days: 30

  restore-drill:
    name: PostgreSQL isolated restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apgic
          POSTGRES_PASSWORD: apgic
          POSTGRES_DB: apgic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apgic -d apgic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: apgic
      PGPASSWORD: apgic
      PGDATABASE: apgic_ci
      APGIC_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000001_r0_foundation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000002_legal_acceptance_mobile_installation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000003_r0_semantic_invariants.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000004_r0_outbox_terminality.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000005_r0_legal_transaction_snapshot.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000006_r1_account_deletion.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000007_r1_marketplace_discovery.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000008_r2_booking_order.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000009_r2_payment_control_plane.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000010_r2_refund_reversal.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000011_r2_transaction_edge.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000012_r2_payment_governance.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000013_r2_mobile_store_entitlements.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000014_r3_communication_consultation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000015_r4_store_lifecycle_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000016_r0_connector_delivery_semantics.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000017_r0_ledger_economic_event_idempotency.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000018_r0_order_product_ownership_snapshot.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000019_r1_specialist_supply_runtime.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000020_r0_organization_direction_runtime.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000021_r0_organization_history_links.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000022_r0_connector_atomic_application.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000023_r0_product_runtime.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000024_r0_published_product_order_gate.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000025_r2_notification_policy_runtime.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000026_r2_offline_mutation_failure.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/000027_r0_order_snapshot_baseline_repair.sql
